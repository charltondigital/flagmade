name: Import Events banner photo
on:
  push:
    paths:
      - '.github/workflows/import-events-banner.yml'
permissions:
  contents: write
jobs:
  import-events-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Alex Cooper photo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          python3 - <<'PY'
          import re, html, urllib.request, pathlib
          urls=[
            'https://unsplash.com/photos/a-group-of-people-playing-musical-instruments-in-a-room-9SajRZ5Zgew',
            'https://jecherchedieu.ch/question/une-interrogation-concernant-deux-passages-bibliques-qui-a-premiere-vue-semble-se-contredire/',
          ]
          target=pathlib.Path('public/images/flagmade-events-orchestra.jpg')
          for page_url in urls:
              try:
                  req=urllib.request.Request(page_url, headers={'User-Agent':'Mozilla/5.0'})
                  page=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
                  candidates=[]
                  for pat in [
                      r'<meta[^>]+property=["\\\']og:image["\\\'][^>]+content=["\\\']([^"\\\']+)',
                      r'<meta[^>]+content=["\\\']([^"\\\']+)["\\\'][^>]+property=["\\\']og:image',
                      r'https://images\\.unsplash\\.com/photo-[^"\\s<>]+'
                  ]:
                      candidates.extend(re.findall(pat,page,flags=re.I))
                  for candidate in candidates[:10]:
                      photo=html.unescape(candidate).replace('&amp;','&')
                      if 'images.unsplash.com' not in photo: continue
                      img_req=urllib.request.Request(photo,headers={'User-Agent':'Mozilla/5.0'})
                      content=urllib.request.urlopen(img_req,timeout=30).read()
                      if content[:3]==b'\\xff\\xd8\\xff' and len(content)>40000:
                          target.write_bytes(content)
                          print('Saved image, bytes:',len(content))
                          break
                  if target.exists(): break
              except Exception as e:
                  print('Source unavailable',page_url,repr(e))
          if not target.exists():
              raise SystemExit('Could not resolve the exact original orchestra photo')
          PY
      - name: Apply local photo and overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/events.astro')
          s=p.read_text().replace('<PageHero title="Events" subtitle="Discover what\'s happening in Flagstaff." />','<PageHero title="Events" subtitle="Music, art, markets, classes and performances in Flagstaff." variant="events" />')
          assert 'variant="events"' in s
          p.write_text(s)
          p=Path('src/styles/brand-system.css')
          s=p.read_text()+"""
          /* Events photo hero — same pine gradient as Local Food, exact Alex Cooper photo */
          .page-hero--events {
            position:relative;isolation:isolate;min-height:275px;
            background-color:#163f38!important;
            background-image:linear-gradient(90deg,rgba(13,52,44,.97) 0%,rgba(13,52,44,.92) 28%,rgba(13,52,44,.70) 50%,rgba(13,52,44,.14) 82%,rgba(13,52,44,.06) 100%),url('/images/flagmade-events-orchestra.jpg')!important;
            background-size:cover!important;background-position:center,center 48%!important;
          }
          .page-hero--events .page-hero-inner{padding-top:66px;padding-bottom:65px}
          .page-hero--events .page-hero-eyebrow{display:none}
          .page-hero--events .page-hero-subtitle{max-width:525px;color:#fff!important}
          @media(max-width:650px){
            .page-hero--events{min-height:210px;background-image:linear-gradient(90deg,rgba(13,52,44,.97) 0%,rgba(13,52,44,.83) 60%,rgba(13,52,44,.40) 100%),url('/images/flagmade-events-orchestra.jpg')!important}
            .page-hero--events .page-hero-inner{padding-top:47px;padding-bottom:48px}
          }
          """
          p.write_text(s)
          p=Path('README.md')
          p.write_text(p.read_text()+"\n## Events banner photograph\n\nThe Events page uses the Alex Cooper orchestra photo supplied by the user (Unsplash ID 9SajRZ5Zgew), copied into `public/images/flagmade-events-orchestra.jpg`. The hero uses `variant=\"events\"` and the shared pine-to-transparent gradient from `src/styles/brand-system.css`. All banner images must remain locally hosted. The photo is illustrative and should not be described as a Flagstaff performance.\n")
          PY
      - name: Commit locally hosted Events banner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/flagmade-events-orchestra.jpg src/pages/events.astro src/styles/brand-system.css README.md
          git commit -m "Self-host orchestra image and style Events hero"
          git pull --rebase origin main
          git push origin HEAD:main
